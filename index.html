<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive rating</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="projectContainer">
        <div id="feedbackContainer">
            <img src="./images/icon-star.svg" alt="star image" class="star">
           <h1 class="feedbackHeading">How did we do?</h1>
           <p class="feedbackParagraph">
            Please let us know we did with
             your <br>
              support request. All feedback is
        appreciated <br>
              to help us improve our offering!
            </p>
              
              <div class="btnContainer">
                <button class="btn">1</button>
                <button class="btn">2</button>
                <button class="btn">3</button>
                <button class="btn">4</button>
                <button class="btn">5</button>
              </div>
              <button id="submitbtn">SUBMIT</button>
        </div>

        <div id="thankYouContainer">
            <img src="./images/illustration-thank-you.svg" alt="thank you image" class="rateimage">
            <p class="thankYouParagraph1">you selected <span id="text"></span> out of 5</p>
            <h1 class="thankYouHeading">Thank you!</h1>
            <p  class="thankYouParagraph2">We appreciate you taking the time to give a <br>
               rating.if you ever need more support. don't <br>
                         hesitate to get in touch!</p>
        </div>
    </div>
</body>
</html>
